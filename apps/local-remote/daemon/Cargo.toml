[package]
name = "local-remote"
version = "0.1.0"
edition = "2021"
description = "DJ Mac control plane: device HTTP, OSC, supervised Media Bridge"

[[bin]]
name = "local-remote"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
dirs = "6"
libc = "0.2"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_socketio = { version = "0.6", default-features = false, features = ["async"] }
rosc = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3"
tokio = { version = "1", features = ["full", "sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.15"
arc-swap = "1"
rtrb = "0.3"
